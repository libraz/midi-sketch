# npm-check-updates configuration.

# Yarn refuses to install versions younger than npmMinimalAgeGate (24h by default),
# so proposing them here would only produce an uninstallable package.json.
cooldown: 1d

# Packages `ncu -u` must not raise, and why. Drop an entry once its blocker is
# gone so the next run picks the package up again.
reject:
  # typescript: the 7.x package ships no compiler API (lib/ holds only tsc.js,
  # getExePath and version), and tests/wasm/package-surface.test.ts walks the
  # published .d.ts through ts.createProgram, so the suite dies on ts.ScriptTarget.
  - typescript
